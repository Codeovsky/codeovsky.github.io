{{ with .Site.Data.process }}
<section class="site-process" id="process">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="section-title">
          <h2>{{ .title }}</h2>
          <p>{{ .subtitle }}</p>
        </div>
      </div>
      {{ range .steps }}
      <div class="col-lg-3 col-md-6">
        <div class="site-process-item">
          <span class="site-process-item-number">{{ .number }}</span>
          <h4>{{ .title }}</h4>
          <p>{{ .description }}</p>
        </div>
      </div>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
