{{ with .Site.Data.services }}
<section class="site-services" id="services">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="section-title">
          <h2>{{ .title | upper }}</h2>
          <p>{{ .subtitle }}</p>
        </div>
      </div>
      {{ range .services }}
      <div class="col-lg-4 col-md-6">
        <div class="site-services-item">
          <div class="site-services-item-icon">
            <i class="fa {{ .icon }}"></i>
          </div>
          <h4>{{ .title }}</h4>
          <p>{{ .description }}</p>
        </div>
      </div>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
